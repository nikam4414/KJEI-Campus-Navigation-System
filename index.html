<style>
html,body{
    height:100%;
    margin:0;
    font-family:'Poppins',sans-serif;
} 
/* Welcome Screen */

#welcomeScreen{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:url("KJEI.jpg") center/cover no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    z-index:9999;
}

.overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(6px);
}

.welcome-content{
    position:relative;
    text-align:center;
    color:white;
}

.logo{
    width:180px;
    height:auto;
    margin-bottom:20px;
    animation:logoFloat 3s ease-in-out infinite;
    filter:drop-shadow(0 12px 25px rgba(0,0,0,.45));
}

.welcome-title{
    font-size:68px;
    font-weight:800;
    color:white;
    text-shadow:0 8px 25px rgba(0,0,0,.45);
    margin:20px 0 10px;

    animation:slideDown 1.2s ease;
}

.tagline{
    font-size:22px;
}

.loader{
    width:60px;
    height:60px;
    border:6px solid rgba(255,255,255,.3);
    border-top:6px solid white;
    border-radius:50%;
    margin:25px auto;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

@keyframes slideDown{

    from{
        opacity:0;
        transform:translateY(-60px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}   
.fade-out{
    animation:fadeOut 1s forwards;
}

@keyframes fadeOut{

    from{
        opacity:1;
    }

    to{
        opacity:0;
        visibility:hidden;
    }

}@keyframes pop{

    from{
        transform:scale(.7);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}
#languageScreen{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#0F2027,#203A43,#2C5364);
    color:white;
    z-index:2200;
    padding:25px;
    overflow:hidden;
}
.langTitle{
    margin-bottom:25px;
    font-size:42px;
    font-weight:700;
    text-align:center;
    letter-spacing:1px;
    color:white;
}
.lang-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:18px;
    width:90%;
    max-width:1200px;
}
.lang-btn{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.3);
    color:white;
    padding:18px;
    border-radius:18px;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:all .35s ease;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    animation:pop .6s ease ;
}
.lang-btn:hover{
    transform:translateY(-8px) scale(1.05);
    background:white;
    color:#0F2027;
    box-shadow:0 20px 35px rgba(0,0,0,.35);
}
.lang-btn:active{
    transform:scale(.97);
}.lang-btn:nth-child(1){
    animation-delay:.1s;
}

.lang-btn:nth-child(2){
    animation-delay:.2s;
}

.lang-btn:nth-child(3){
    animation-delay:.3s;
}

.lang-btn:nth-child(4){
    animation-delay:.4s;
}

.lang-btn:nth-child(5){
    animation-delay:.5s;
}

.lang-btn:nth-child(6){
    animation-delay:.6s;
}

.location-container{

    opacity:.85;

    display:grid;

    repeat(auto-fit,minmax(260px,1fr));

.location-card{

    0 15px 35px rgba(0,0,0,.25);

#locationScreen{

html,body{

    margin:0;
    overflow:auto;
}

/* ---------- App state ---------- */
let selectedLang = 'en';
const TCOER_COORDS = [18.421541,73.905922];
const REACH_RADIUS_METERS = 100; // show dept box when inside ~25 m

/* ---------- build language buttons ---------- */
const langContainer = document.getElementById('languageOptions');
languageList.forEach(l => {
  const btn = document.createElement('button');
  btn.className = 'lang-btn';
  btn.textContent = l.label;
  btn.onclick = () => chooseLanguage(l.code);
  langContainer.appendChild(btn);
});

/* ---------- choose language, initialize UI ---------- */
function chooseLanguage(code){

    if(!T[code]) code = 'en';
    selectedLang = code;

    document.getElementById("languageScreen").style.display = "none";

    applyTranslations();

    // If this browser has already registered, skip details
    if(localStorage.getItem("userRegistered") === "true"){
        showLocationScreen();
    }else{
        document.getElementById("detailsScreen").style.display = "flex";
    }
    const tr = T[selectedLang] || T.en;

document.getElementById("locationTitle").textContent =
    tr.locationTitle || "Select your destination";

document.getElementById("locationSubtitle").textContent =
    tr.locationSubtitle || "Choose a campus location to start navigation";
}

/* ---------- apply translations ---------- */
function applyTranslations(){

    const tr = T[selectedLang] || T.en;

    document.getElementById("locationTitle").textContent =
        tr.locationTitle || "Select your destination";

    document.getElementById("locationSubtitle").textContent =
        tr.locationSubtitle || "Choose a campus location to start navigation";
  // update dept buttons (labels remain english names with numbers)


}

let userName = "";
let userPhone = "";

document.getElementById("detailsNextBtn").onclick = function () {

    userName = document.getElementById("userName").value.trim();
    userPhone = document.getElementById("userPhone").value.trim();

    if (userName === "") {
        alert("Please enter your name");
        return;
    }

    if (!/^[0-9]{10}$/.test(userPhone)) {
        alert("Enter a valid 10 digit phone number");
        return;
    }

   fetch("http://localhost:5000/save-user", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
        body: JSON.stringify({
            name: userName,
            phone: userPhone
        })
    })
  .then(async res => {
    const data = await res.json();
    console.log("Status:", res.status);
    console.log("Response:", data);

    if (data.success) {

        localStorage.setItem("userRegistered", "true");
        document.getElementById("detailsScreen").style.display = "none";
        showLocationScreen();

    } else {

        alert("Database Error: " + (data.error || "Unknown"));

    }
})
   .catch(err => {
    console.error("Fetch Error:", err);
    alert(err.message);
});

};
function getPlaceName(id) {

    if (
        PLACE_TRANSLATIONS[selectedLang] &&
        PLACE_TRANSLATIONS[selectedLang][id]
    ) {
        return PLACE_TRANSLATIONS[selectedLang][id];
    }

    if (PLACE_TRANSLATIONS.en[id]) {
        return PLACE_TRANSLATIONS.en[id];
    }

    return id;
}

function showLocationScreen(){

    document.getElementById("locationScreen").style.display="flex";

    const list=document.getElementById("locationList");

    list.innerHTML="";

   PLACES.forEach(place=>{

    const card=document.createElement("div");

    card.style.background="white";
    card.style.borderRadius="18px";
    card.style.overflow="hidden";
    card.style.cursor="pointer";
    card.style.boxShadow="0 10px 25px rgba(0,0,0,.3)";
    card.style.transition=".3s";

    card.innerHTML=`
       <img src="${place.image}"
     onerror="this.src='images/default.jpg'"
             style="width:100%;height:200px;object-fit:cover;">

       <h3 style="
margin:15px;
color:#0F2027;
text-align:center;
font-size:20px;
font-weight:bold;">
${getPlaceName(place.id)}
</h3>
    `;

    card.onmouseenter=()=>{
        card.style.transform="scale(1.04)";
    };

    card.onmouseleave=()=>{
        card.style.transform="scale(1)";
    };

   card.onclick = function () {

    if (!navigator.geolocation) {
        alert("Geolocation is not supported.");
        return;
    }

   navigator.geolocation.getCurrentPosition(

function(position){

    const origin =
        position.coords.latitude + "," +
        position.coords.longitude;

    const destination =
        place.coords[0] + "," +
        place.coords[1];

   const url =
    `https://www.google.com/maps/dir/?api=1` +
    `&origin=${origin}` +
    `&destination=${destination}` +
    `&travelmode=walking` +
    `&dir_action=navigate`;

window.open(url, "_blank");
},

function(error){

    alert("Please allow location access.");

},

{
    enableHighAccuracy:true
}

);

};

    list.appendChild(card);

   });

}
