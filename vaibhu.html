<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg,#007bff);
        font-family: 'Baloo 2', cursive;
        overflow: hidden;
        position: relative;
    }

    /* PAGE 1 */
    #page1 {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }

    #title {
        font-size: 70px;
        color: #e5dade;
        opacity: 0;
        transition: opacity 2.5s ease;
        text-align: center;
        position: relative;
        z-index: 100;
    }

    #title::after{
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        height: 100%;
        width: 100%;
        background: linear-gradient(
            120deg,
            transparent 0%,
            rgba(230, 226, 227, 0.925) 50%,
            transparent 100%
        );
        animation: shineOnce 2s linear forwards;
        animation-delay: 0.5s;
    }

    @keyframes shineOnce {
        from { left: -100%; }
        to   { left: 100%; }
    }

    @keyframes flyPlane {
        0%   { transform: translate(-200px, 150px) rotate(-20deg); opacity: 1; }
        25%  { transform: translate(10vw, -5vh) rotate(-8deg); opacity: 1; }
        50%  { transform: translate(40vw, -25vh) rotate(5deg); opacity: 1; }
        75%  { transform: translate(75vw, -50vh) rotate(15deg); opacity: 1; }
        92%  { transform: translate(105vw, -75vh) rotate(22deg); opacity: 1; }
        100% { transform: translate(130vw, -100vh) rotate(25deg); opacity: 0; }
    }

    .plane {
        width: 150px;
        position: absolute;
        bottom: 0;
        left: 0;
        animation: flyPlane 3s linear forwards;
        z-index: 9999;
    }

    .dot {
        position: absolute;
        width: 14px;
        height: 14px;
        background: white;
        border-radius: 50%;
        opacity: 0.8;
        filter: blur(1px);
        animation: dotFade 1.2s linear forwards;
    }

    @keyframes dotFade {
        from { opacity: 0.8; transform: scale(1); }
        to { opacity: 0; transform: scale(0.5); }
    }

    /* PAGE 2 */
    #page2 {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        padding-top: 40px;
        overflow-y: auto;
        animation: fadeIn 1.8s ease forwards;
    }

    .search-box {
        width: 70%;
        max-width: 500px;
        padding: 15px 20px;
        font-size: 22px;
        border-radius: 12px;
        border: none;
        outline: none;
        margin-bottom: 25px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    }

    .container {
        width: 85%;
        max-width: 1100px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
    }

    .box {
         position: relative;    /* <-- ADD */
    overflow: hidden;  
        background: white;
        color: black;
        padding: 20px 22px;
        font-size: 22px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 8px 20px rgba(0,0,0,0.18);
        transition: 0.3s ease;
        cursor: pointer;
    }

    .box:hover {
        transform: translateY(-5px);
    }

    /* PAGE 3 (MAP) */
    #page3 {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        background: white;
    }

    #map {
        width: 100%;
        height: 100%;
    }

   #infoPanel {

    /* 🔥 CLICK GLOSS EFFECT (RED RIPPLE) --------------------- */
.click-gloss {
  position: relative;
  overflow: hidden;
  display: inline-block; /* ensures ripple shows for inline elements */
  vertical-align: middle;
  z-index: 0; /* allow circle to show inside, not above everything */
}


.click-gloss::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    background: rgba(255, 50, 120, 0.5);
    border-radius: 50%;
    transform: scale(0);
    opacity: 0;
    pointer-events: none;
    animation: none;
}

@keyframes glossRipple {
    0% {
        transform: scale(0);
        opacity: 0.9;
    }
    80% {
        transform: scale(20);
        opacity: 0.4;
    }
    100% {
        transform: scale(30);
        opacity: 0;
    }
}

/* FORCE ALL CLICK-GLOSS ELEMENTS TO SHOW RIPPLE ABOVE CONTENT */
/* MAIN GLOSS CLASS */
/* 🔥 CLICK GLOSS EFFECT (RED RIPPLE) --------------------- */
/* 🔥 CLICK GLOSS EFFECT (VISIBLE RED RIPPLE) --------------------- */

}

/* Ripple circle */
.gloss-circle {

  transform-origin: center;

}

@keyframes glossRipple {
  0% { transform: scale(0); opacity: 0.9; }
  80% { transform: scale(12); opacity: 0.5; }

}

/* Form controls inside wrapper */
.click-gloss select,
.click-gloss input,
.click-gloss button {
  position: relative;

}

/* GLOSS CIRCLE */
.gloss-circle {

@keyframes glossRipple {

}


.gloss-circle {
  pointer-events: none;

  will-change: transform, opacity;

}

/* ✨ UNIVERSAL CLICK GLOSS EFFECT ✨ */
.click-gloss {

}

/* Normal ripple circle */
.gloss-circle {

/* Form control fallback (pulse effect instead of ripple) */

select.click-gloss:active, input.click-gloss:active {

<style>
/* 💜✨ PURPLE FAIRY DUST CLICK EFFECT */
.fairy-dust {
  position: fixed;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: radial-gradient(circle, rgb(38, 0, 255), rgba(28, 25, 188, 0.8), transparent 70%);
  box-shadow:
    0 0 35px rgba(17, 0, 255, 0.9),
    0 0 80px rgba(100, 152, 255, 0.7),
    0 0 150px rgba(255, 255, 255, 0.5);
  pointer-events: none;
  transform: translate(-50%, -50%) scale(0);
  animation: fairyDustMain 1.1s ease-out forwards;
  z-index: 999999;
  filter: blur(1px);
}

@keyframes fairyDustMain {
  0% {
    transform: translate(-50%, -50%) scale(0);
    opacity: 1;
    filter: blur(0px);
  }
  40% {
    transform: translate(-50%, -50%) scale(3);
    opacity: 0.9;
    filter: blur(2px);
  }
  70% {
    transform: translate(-50%, -50%) scale(8);
    opacity: 0.7;
    filter: blur(4px);
  }
  100% {
    transform: translate(-50%, -50%) scale(15);
    opacity: 0;
    filter: blur(8px);
  }
}

/* ✨ Sparkling Particles */
.spark {
  position: fixed;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(200, 255, 206, 0.95);
  box-shadow: 0 0 15px rgb(25, 11, 157),
              0 0 25px rgba(43, 0, 255, 0.9);
  pointer-events: none;
  animation: sparkleFly 0.8s ease-out forwards;
  z-index: 999999;
}

@keyframes sparkleFly {
  0% {
    transform: translate(0, 0) scale(1);
    opacity: 1;
    filter: blur(0);
  }
  50% {
    opacity: 0.9;
    filter: blur(1px);
  }

/* FINAL GLOBAL CLICK GLOSS HANDLER */
/* 💫 Final Ripple + Pulse Handler */
document.addEventListener("click", function (e) {
  const target = e.target.closest(".click-gloss");
  if (!target) return;

  // if select or input → apply pulse only
  if (target.tagName === "SELECT" || target.tagName === "INPUT") {
    target.classList.add("pulse");
    setTimeout(() => target.classList.remove("pulse"), 300);
    return;
  }

  // else → ripple
  const rect = target.getBoundingClientRect();
  const ripple = document.createElement("span");
  ripple.classList.add("gloss-circle");

  const size = Math.max(rect.width, rect.height);
  const x = e.clientX - rect.left - size / 2;
  const y = e.clientY - rect.top - size / 2;

  ripple.style.width = ripple.style.height = size + "px";
  ripple.style.left = x + "px";
  ripple.style.top = y + "px";

  target.appendChild(ripple);
  ripple.addEventListener("animationend", () => ripple.remove());
});

}

function startNavigation(name) {

        });

        const terrainTiles = L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {

        });

        const darkTiles = L.tileLayer("https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "© CartoDB"
        });

        // Add default layer
        osmTiles.addTo(map);

        // Layer control (like Google Maps)
        const baseLayers = {
            "🗺️ Road Map": osmTiles,
            "📡 Satellite": satelliteTiles,
            "🏔️ Terrain": terrainTiles,
            "🌙 Dark": darkTiles
        };

        L.control.layers(baseLayers, null, { collapsed: true, position: "topright" }).addTo(map);

        /* 📍 Add Fullscreen Button */
        map.addControl(new L.Control.Fullscreen({ position: "topright" }));

        /* 📍 Add Locate Control (Geolocation) */
        L.control.locate({ position: "topright", drawCircle: true, drawMarker: true }).addTo(map);

        /* 📏 Add Measure Distance Tool */
        L.control.measure({ position: "topright", primaryLengthUnit: "kilometers" }).addTo(map);

        /* 🗺️ Enhanced Zoom Controls */
        const zoomControl = map.zoomControl;
        zoomControl.setPosition("topleft");
    }

    // FIX: force resize after showing map
    setTimeout(() => {
        map.invalidateSize();
    }, 300);

    // Remove old routing
    if (routing) {
        map.removeControl(routing);
        routing = null;
    }

    // Create routing
    routing = L.Routing.control({
        waypoints: [],
        routeWhileDragging: false,
        draggableWaypoints: false,
        addWaypoints: false,
        showAlternatives: false,
        fitSelectedRoutes: true,
        createMarker: () => null,
        lineOptions: {
            styles: [{ color: "#ff4fa3", weight: 6 }]
        }
    }).addTo(map);

    routing.on("routesfound", (e) => {
        const r = e.routes[0];
        const distanceKm = (r.summary.totalDistance / 1000).toFixed(2);
        const etaMin = Math.ceil(r.summary.totalTime / 60);

        // 🎯 Store route data for navigation tracking
        totalRouteDist = r.summary.totalDistance;  // in meters
        totalRouteTime = r.summary.totalTime;      // in seconds
        travelledDist = 0;                         // Reset travelled distance
        userPositionsHistory = [];                 // Clear history
        currentSpeed = 0;
        lastUserPos = null;
        lastUpdateTime = null;
        lastVoiceUpdateTime = 0;                   // Reset voice update timer
        voiceAnnouncements = [];                   // Reset voice announcements

        // Extract route coordinates for distance calculation
        if (r.coordinates && r.coordinates.length > 0) {
            routePolyline = r.coordinates;
        }

        document.getElementById("distance").textContent = "📍 Total: " + distanceKm + " km";
        document.getElementById("eta").textContent = "⏱️ Estimated Time: " + etaMin + " min";
        document.getElementById("remainingDistance").textContent = "🔴 Remaining: " + distanceKm + " km";
        document.getElementById("remainingTime").textContent = "⏳ Time Left: " + etaMin + " min";
        document.getElementById("travelledDistance").textContent = "✅ Travelled: 0 km";
        document.getElementById("progressBar").style.width = "0%";
    });

    // Destination marker
    if (destMarker) map.removeLayer(destMarker);

    destMarker = L.marker([activeDestination.lat, activeDestination.lng]).addTo(map);

    startTracking();
}

function startTracking() {
    if (!navigator.geolocation) {
        alert("Geolocation not supported");
        return;
    }

    if (watchId) navigator.geolocation.clearWatch(watchId);

    watchId = navigator.geolocation.watchPosition(pos => {
        const userPos = [pos.coords.latitude, pos.coords.longitude];
        const currentTime = Date.now();

        if (!userMarker) {
            userMarker = L.marker(userPos, {
                icon: L.divIcon({
                    className: 'user-location-marker',
                    html: '<div style="background: #4CAF50; border: 3px solid white; border-radius: 50%; width: 20px; height: 20px; box-shadow: 0 0 10px rgba(76,175,80,0.7);"></div>'
                })
            }).addTo(map);
        } else {
            userMarker.setLatLng(userPos);
        }

        // 🎯 Calculate speed (in km/h)
        if (lastUserPos && lastUpdateTime) {
            const distMeters = L.latLng(lastUserPos[0], lastUserPos[1]).distanceTo(L.latLng(userPos[0], userPos[1]));
            const timeSeconds = (currentTime - lastUpdateTime) / 1000;
            if (timeSeconds > 0) {
                currentSpeed = (distMeters / timeSeconds * 3.6).toFixed(1); // Convert m/s to km/h
            }
            travelledDist += distMeters;
        }

        lastUserPos = userPos;
        lastUpdateTime = currentTime;
        userPositionsHistory.push(userPos);

        // 🎯 Calculate remaining distance to destination
        const destLatLng = L.latLng(activeDestination.lat, activeDestination.lng);
        const userLatLng = L.latLng(userPos[0], userPos[1]);
        const remainingDist = destLatLng.distanceTo(userLatLng);
        const remainingDistKm = (remainingDist / 1000).toFixed(2);
        const travelledDistKm = (travelledDist / 1000).toFixed(2);

        // 🎯 Calculate ETA based on current speed (if moving)
        let etaMinutes = "calculating...";
        if (currentSpeed > 0.1) {
            etaMinutes = Math.ceil(remainingDist / (currentSpeed / 3.6)); // Convert km/h to m/s
        } else if (totalRouteTime > 0) {
            // Fallback: use original estimated time if not moving yet
            const percentTravelled = totalRouteDist > 0 ? travelledDist / totalRouteDist : 0;
            etaMinutes = Math.ceil(totalRouteTime * (1 - percentTravelled) / 60);
        }

        // 🎯 Calculate progress percentage
        const progressPercent = totalRouteDist > 0 ? (travelledDist / totalRouteDist * 100).toFixed(1) : 0;

        // 📊 Update UI
        document.getElementById("remainingDistance").textContent = "🔴 Remaining: " + remainingDistKm + " km";
        document.getElementById("remainingTime").textContent = "⏳ Time Left: " + (typeof etaMinutes === 'number' ? etaMinutes + " min" : etaMinutes);
        document.getElementById("currentSpeed").textContent = "🚗 Speed: " + currentSpeed + " km/h";
        document.getElementById("travelledDistance").textContent = "✅ Travelled: " + travelledDistKm + " km (" + progressPercent + "%)";
        document.getElementById("progressBar").style.width = Math.min(progressPercent, 100) + "%";

        // �️ Voice Announcements for navigation updates
        handleNavigationVoiceUpdates(parseFloat(remainingDistKm), (typeof etaMinutes === 'number' ? etaMinutes : parseInt(etaMinutes)), parseFloat(currentSpeed));

        // �🎯 Check if arrived (within 30 meters)
        if (remainingDist < 30 && !arrivalShown) {
            showArrivalPanel();
        }

        // update route
        if (routing) {
            routing.setWaypoints([
                L.latLng(userPos[0], userPos[1]),
                L.latLng(activeDestination.lat, activeDestination.lng)
            ]);
        }

    }, () => {
        alert("Enable location access");
    }, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
    });
}

function getTranslatedPlaceName(originalName, lang){
  if (typeof translations !== 'undefined' && translations[originalName] && translations[originalName][lang]) {
    return translations[originalName][lang];
  }
  return originalName;
}

/* 5) create a small red circle marker (uses circleMarker for crisp red dot) */
function createRedDotMarker(latlng){
  return L.circleMarker(latlng, {
    radius: 7,
    color: "#b30000",
    weight: 1,
    fillColor: "#ff3b3b",
    fillOpacity: 0.95
  });
}

/* 6) main function to add all dots and popups */
function addLocationDots(){
  // if map does not exist yet, wait and retry shortly
  if (typeof map === 'undefined' || !map) {
    // try again after map is created (repeat few times)
    setTimeout(addLocationDots, 300);
    return;
  }

  // clear previous layer if present
  if (locationDotsLayer) {
    locationDotsLayer.clearLayers();
  } else {
    locationDotsLayer = L.layerGroup().addTo(map);
  }

  const lang = (document.getElementById('languageSelect') && document.getElementById('languageSelect').value) || 'en';

  Object.keys(locations).forEach(originalName => {
    const coords = locations[originalName];
    if (!coords) return;

    // marker (red dot)
    const marker = createRedDotMarker([coords.lat, coords.lng]);

    // image URL (fallback to placeholder)
    const img = locationImages[originalName] || 'https://via.placeholder.com/400x250?text=No+Image';

    // translated title
    const title = getTranslatedPlaceName(originalName, lang);

    // popup HTML (includes Visit button with data-name)
    const popupHTML = `
      <div class="loc-popup">
        <h3>${title}</h3>
        <img src="${img}" alt="${title}" onerror="this.src='https://via.placeholder.com/400x250?text=No+Image'">
        <button class="visit-btn" data-name="${originalName}">${ (lang === 'hi' ? 'जाएँ' : (lang === 'mr' ? 'जा' : (lang === 'de' ? 'Besuchen' : (lang === 'ja' ? '訪問' : (lang === 'zh' ? '访问' : 'Visit'))))) }</button>
      </div>
    `;

    marker.bindPopup(popupHTML, { minWidth: 200 });

    // add click handler for popupopen — we use a map-level popupopen listener below
    marker.addTo(locationDotsLayer);
  });

  // optional: fit map to show all dots (only if there is no active route)
  try {
    const groupBounds = locationDotsLayer.getBounds();
    if (groupBounds.isValid() && (!routing || routing === null)) {
      map.fitBounds(groupBounds.pad(0.25));
    }
  } catch (e) { /* ignore */ }
}

        // close popup
        e.popup.remove();
        // call existing startNavigation with the canonical English name
        if (typeof startNavigation === 'function') {
          startNavigation(originalName);
        } else {
          console.warn('startNavigation() not found. Please ensure your function exists.');
        }
      });
    }
  } else {
    // fallback: content is string — attach a delayed DOM listener
    setTimeout(()=> {
      const container = document.querySelector('.leaflet-popup-content');
      if (!container) return;
      const btn = container.querySelector('.visit-btn');
      if (btn) {
        btn.onclick = (ev) => {
          const originalName = btn.getAttribute('data-name');
          if (typeof startNavigation === 'function') startNavigation(originalName);
        };
      }
    }, 120);
  }
});

/* 8) auto-run whenever the map becomes available (safe to call multiple times) */

    const tries = setInterval(()=>{

// 🧭 Function to stop navigation and return to previous page
function stopNavigation() {
  // Hide map page
  page3.style.display = "none";

  // Show previous page (Page 2 - campus list)
  page2.style.display = "flex";

  // Clear routing info
  if (routing) {
    routing.remove();
    routing = null;
  }

  // Remove user marker
  if (userMarker) {
    map.removeLayer(userMarker);
    userMarker = null;
  }

  // Stop geolocation tracking
  if (watchId) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }

  // Stop any live distance/ETA update intervals
  if (window.liveRouteInterval) {
    clearInterval(window.liveRouteInterval);
    window.liveRouteInterval = null;
  }

  if (window.liveDistanceUpdater) {
  clearInterval(window.liveDistanceUpdater);
  window.liveDistanceUpdater = null;
}

  // Stop any voice announcements
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  // Reset navigation tracking variables
  voiceAnnouncements = [];
  lastVoiceUpdateTime = 0;
  arrivalShown = false;
  arrivalVoiceCount = 0;

  // Optional: close any open map popups
  if (map) {
    map.closePopup();
  }
}

/* 🎙️ Navigation Voice Announcements */
let lastVoiceUpdateTime = 0;
let voiceAnnouncements = [];

function announceNavigation(message) {
  if (!("speechSynthesis" in window)) return;

  const utter = new SpeechSynthesisUtterance(message);
  const voices = speechSynthesis.getVoices();
  const pickVoice = voices.find(v => /en-IN/i.test(v.lang)) || 
                    voices.find(v => /en-US/i.test(v.lang)) || 
                    voices[0];
  
  if (pickVoice) utter.voice = pickVoice;
  utter.rate = 0.9;
  utter.pitch = 1;
  utter.volume = 0.9;

  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}

function handleNavigationVoiceUpdates(remainingDistKm, remainingTimeMin, currentSpeed) {
  const now = Date.now();

  // Announce every 2 minutes (120000 ms)
  if (now - lastVoiceUpdateTime > 120000) {
    const message = `You have ${remainingDistKm} kilometers left. Approximately ${remainingTimeMin} minutes remaining. Current speed is ${currentSpeed} kilometers per hour.`;
    announceNavigation(message);
    lastVoiceUpdateTime = now;
  }

  // Announce when 5, 2, 1 km remaining
  if (remainingDistKm <= 5 && !voiceAnnouncements.includes("5km")) {
    announceNavigation("Only 5 kilometers remaining to your destination.");
    voiceAnnouncements.push("5km");
  }
  if (remainingDistKm <= 2 && !voiceAnnouncements.includes("2km")) {
    announceNavigation("You are almost there! Only 2 kilometers remaining.");
    voiceAnnouncements.push("2km");
  }
  if (remainingDistKm <= 1 && !voiceAnnouncements.includes("1km")) {
    announceNavigation("You are 1 kilometer away from your destination.");
    voiceAnnouncements.push("1km");
  }
  if (remainingDistKm <= 0.5 && !voiceAnnouncements.includes("500m")) {
    announceNavigation("Your destination is just ahead. About 500 meters remaining.");
    voiceAnnouncements.push("500m");
  }
  if (remainingDistKm <= 0.1 && !voiceAnnouncements.includes("arrived")) {
    announceNavigation("You have arrived at your destination!");
    voiceAnnouncements.push("arrived");
  }
}

function speakWelcomeTwice() {
  if (!("speechSynthesis" in window)) return;

  const makeUtter = () => {
    const u = new SpeechSynthesisUtterance("Welcome to T C O E R. Please choose your department.");
    // try to pick a pleasant female english-india voice if available
    const voices = speechSynthesis.getVoices();
    const pick =
      voices.find(v => /en-IN/i.test(v.lang) && /female|woman|girl/i.test(v.name)) ||
      voices.find(v => /en-IN/i.test(v.lang)) ||
      voices.find(v => /female|woman|girl|google us english/i.test(v.name)) ||
      voices[0];
    if (pick) u.voice = pick;
    u.rate = 1; u.pitch = 1.05; u.volume = 1;
    return u;
  };

  // cancel anything ongoing
  speechSynthesis.cancel();

  const speakOnce = () => {
    if (arrivalVoiceCount >= 2) return;
    const utter = makeUtter();
    utter.onend = () => {
      arrivalVoiceCount++;
      // queue second one after a short pause
      if (arrivalVoiceCount < 2) setTimeout(speakOnce, 900);
    };
    speechSynthesis.speak(utter);
  };

  if (!speechSynthesis.getVoices().length) {
    const ready = () => {
      speechSynthesis.removeEventListener("voiceschanged", ready);
      speakOnce();
    };
    speechSynthesis.addEventListener("voiceschanged", ready);
    setTimeout(speakOnce, 250);
  } else {
    speakOnce();
  }
}

function showArrivalPanel(){
  if (arrivalShown) return;
  arrivalShown = true;

  const panel = document.getElementById("arrivalPanel");
  if (panel) panel.classList.add("show");
  if (map) map.dragging.disable();

  // speak exactly twice
  arrivalVoiceCount = 0;
  speakWelcomeTwice();
}

function hideArrivalPanel(){
  const panel = document.getElementById("arrivalPanel");
  if (panel) panel.classList.remove("show");
  if (map) map.dragging.enable();

  // stop any ongoing speech
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}

/* 🔍 MAP SEARCH BOX FUNCTIONALITY */
const mapSearchBox = document.getElementById("mapSearchBox");
if (mapSearchBox) {
    let searchTimeout;

    mapSearchBox.addEventListener("input", (e) => {
        clearTimeout(searchTimeout);
        const query = e.target.value.toLowerCase().trim();

        if (query.length < 1) {
            mapSearchBox.style.borderBottom = "none";
            return;
        }

        searchTimeout = setTimeout(() => {
            const matches = Object.keys(locations).filter(name =>
                name.toLowerCase().includes(query)
            );

            if (matches.length > 0) {
                mapSearchBox.style.borderBottom = "3px solid #ff6a9a";
            } else {
                mapSearchBox.style.borderBottom = "3px solid #ccc";
            }
        }, 300);
    });

    mapSearchBox.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
            const query = mapSearchBox.value.toLowerCase().trim();
            const match = Object.keys(locations).find(name =>
                name.toLowerCase().includes(query)
            );

            if (match) {
                startNavigation(match);
                mapSearchBox.value = "";
                mapSearchBox.style.borderBottom = "none";
            } else {
                alert("Location not found. Please check the spelling.");
            }
        }
    });

    mapSearchBox.addEventListener("focus", () => {
        mapSearchBox.style.boxShadow = "0 6px 18px rgba(0,0,0,0.25)";
    });

    mapSearchBox.addEventListener("blur", () => {
        mapSearchBox.style.boxShadow = "0 4px 12px rgba(0,0,0,0.15)";
        mapSearchBox.style.borderBottom = "none";
    });
}

/* 🎮 KEYBOARD SHORTCUTS FOR MAP */
document.addEventListener("keydown", (e) => {
    if (page3.style.display !== "flex") return;

    // Press 'L' to toggle layer control
    if (e.key.toLowerCase() === "l" && e.ctrlKey) {
        e.preventDefault();
        const layerControl = document.querySelector(".leaflet-control-layers-toggle");
        if (layerControl) layerControl.click();
    }

    // Press 'F' for fullscreen
    if (e.key.toLowerCase() === "f" && e.ctrlKey) {
        e.preventDefault();
        const fullscreenBtn = document.querySelector(".leaflet-fullscreen-button");
        if (fullscreenBtn) fullscreenBtn.click();
    }

    // Press 'M' to measure distance
    if (e.key.toLowerCase() === "m" && e.ctrlKey) {
        e.preventDefault();
        const measureBtn = document.querySelector(".leaflet-control-measure-toggle");
        if (measureBtn) measureBtn.click();
    }

    // Press 'G' for geolocation
    if (e.key.toLowerCase() === "g" && e.ctrlKey) {
        e.preventDefault();
        const locateBtn = document.querySelector(".leaflet-bar.leaflet-control").querySelector("a");
        if (locateBtn) locateBtn.click();
    }
});

document.addEventListener("click", e => {

});

};
