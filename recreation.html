<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Welcome Page</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #007bff);
        font-family: "Helvetica", serif;
        color: white;
        overflow: hidden;
    }

    #textBox {
        text-align: center;
        font-size: 38px;
        font-weight: bold;
        opacity: 0;
        transition: opacity 1s ease-in-out;
    }
</style>
</head>
<body>

<div id="textBox">Welcome</div>

<script>
function speakText(text) {
    let speech = new SpeechSynthesisUtterance(text);
    speech.pitch = 1;
    speech.rate = 1;
    speech.volume = 1;
    speech.voice = speechSynthesis.getVoices().find(v => v.name.includes("Female")) || speechSynthesis.getVoices()[0];
    speechSynthesis.speak(speech);
}

// Show "Welcome"
let textBox = document.getElementById("textBox");
textBox.style.opacity = 1;
speakText("Welcome");

// After 1 second, show second message
setTimeout(() => {
    textBox.style.opacity = 0;

    setTimeout(() => {
        textBox.innerHTML = "Let's Navigate your way to destination.";
        textBox.style.opacity = 1;
        speakText("Let's navigate your way to destination.");
    }, 1000);

}, 2000);
</script>

</body>
</html>
